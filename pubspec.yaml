name: working_trust
description: "WorkingTrust - A professional trust management application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  http: ^1.2.1
  image_picker: ^1.2.4
  flutter_secure_storage: ^11.2.0
  url_launcher: ^6.3.3
  google_sign_in: ^7.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_local_notifications: 19.5.0
  file_picker: ^13.3.2
  pdf: ^3.12.0

dependency_overrides:
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/
